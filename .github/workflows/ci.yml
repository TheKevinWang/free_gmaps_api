name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Create locked development environment
        run: uv sync --extra dev --locked
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check --no-cache .
      - name: Type check
        run: uv run --no-sync mypy --no-incremental src tests
      - name: Run deterministic tests
        run: uv run --no-sync pytest -p no:cacheprovider -m "not live and not official" -q
